<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品集 · Portfolio</title>
<style>
  :root {
    --bg: #ffffff; --text: #111111; --muted: #6b7280;
    --border: #e5e7eb; --radius: 12px; --sidebar-w: 260px;
    --accent: #3b82f6; --accent-light: #eff6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); line-height: 1.6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { text-decoration: none; }
  html { scroll-behavior: smooth; }

  /* ===== 整体布局：侧边栏 + 主内容 ===== */
  .layout { display: flex; min-height: 100vh; }

  /* ===== 侧边栏 ===== */
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    position: fixed; top: 0; left: 0; height: 100vh;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 32px 24px;
    background: linear-gradient(180deg, #fafbfc 0%, #f3f4f6 100%);
    z-index: 100;
  }
  .sidebar .logo { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 4px; }
  .sidebar .logo span { color: var(--muted); font-weight: 400; font-size: 14px; }
  .sidebar .sub { color: var(--muted); font-size: 12px; margin-bottom: 36px; }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
  .sidebar nav a {
    color: var(--muted); font-size: 14px; padding: 8px 12px;
    border-radius: 8px; transition: all 0.25s;
    display: flex; align-items: center; justify-content: space-between;
    border-left: 2px solid transparent;
  }
  .sidebar nav a:hover { background: rgba(59,130,246,0.06); color: var(--accent); }
  .sidebar nav a.active {
    background: rgba(59,130,246,0.08); color: var(--accent); font-weight: 600;
    border-left-color: var(--accent);
  }
  .sidebar nav a .num { font-size: 11px; color: #9ca3af; }
  .sidebar .foot { margin-top: auto; color: #9ca3af; font-size: 12px; line-height: 1.8; }
  .sidebar .foot b { display: block; color: var(--muted); font-size: 13px; }

  /* ===== 主内容区 ===== */
  .main {
    flex: 1; min-width: 0;
    margin-left: var(--sidebar-w);
    padding: 48px 48px 64px;
  }

  .hero { margin-bottom: 48px; position: relative; }
  .hero h1 {
    font-size: clamp(28px, 3.5vw, 44px); font-weight: 800; letter-spacing: -1px;
    animation: heroIn 0.8s ease both;
  }
  .hero p { color: var(--muted); margin-top: 8px; font-size: 15px; animation: heroIn 0.8s 0.1s ease both; }
  .hero .stats {
    margin-top: 20px; display: flex; gap: 28px;
    animation: heroIn 0.8s 0.2s ease both;
  }
  .hero .stats div { font-size: 13px; color: var(--muted); }
  .hero .stats b { display: block; font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; }

  @keyframes heroIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .block {
    margin-bottom: 64px; scroll-margin-top: 24px;
    position: relative;
  }
  .block::before {
    content: ""; position: absolute; left: -24px; top: 0;
    width: 4px; height: 100%; border-radius: 2px;
    background: linear-gradient(180deg, var(--accent), transparent);
    opacity: 0; transition: opacity 0.4s ease;
  }
  .block.in::before { opacity: 1; }
  .block h2 {
    font-size: 20px; font-weight: 700; margin-bottom: 6px;
    display: flex; align-items: center; gap: 12px;
  }
  .block h2::after { content: ""; flex: 1; height: 1px; background: var(--border); transform: scaleX(0); transform-origin: left; transition: transform 0.6s ease; }
  .block.in h2::after { transform: scaleX(1); }
  .block .group-desc { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  /* ===== 作品网格 ===== */
  .grid {
    display: grid; gap: 24px;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  }
  .card {
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; background: #fff;
    opacity: 0; transform: translateY(24px);
    transition: opacity 0.6s ease, transform 0.6s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    will-change: opacity, transform;
    cursor: pointer;
  }
  .card.in { opacity: 1; transform: none; }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 32px rgba(59,130,246,0.08);
    border-color: rgba(59,130,246,0.2);
  }
  .card .player { position: relative; background: #f3f4f6; overflow: hidden; }
  .card video, .card img { width: 100%; display: block; object-fit: cover; }
  .card video { aspect-ratio: 16/9; pointer-events: none; }
  .card img { aspect-ratio: 4/3; }
  .card .player iframe { width: 100%; aspect-ratio: 16/9; border: 0; display: block; }
  .card .badge {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    background: rgba(0,0,0,0.65); color: #fff;
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
  }
  .card .badge.pending { background: rgba(234,179,8,0.9); color: #111; }
  .card .meta { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  .card .meta h3 { font-size: 15px; font-weight: 600; }
  .card .meta span { font-size: 12px; color: var(--muted); background: #f3f4f6; padding: 3px 10px; border-radius: 999px; }
  .card .desc { padding: 0 16px 14px; font-size: 12px; color: var(--muted); }

  /* ===== 灯箱：图片/视频查看 ===== */
  .lightbox {
    position: fixed; inset: 0; z-index: 10000;
    background: rgba(0,0,0,0.92); display: flex;
    align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox img, .lightbox video {
    max-width: 92vw; max-height: 88vh; border-radius: 8px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    transform: scale(0.92); transition: transform 0.3s ease;
    background: #000;
  }
  .lightbox.open img, .lightbox.open video { transform: scale(1); }
  .lightbox .close {
    position: absolute; top: 20px; right: 24px; width: 40px; height: 40px;
    border-radius: 50%; background: rgba(255,255,255,0.12);
    border: none; color: #fff; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .lightbox .close:hover { background: rgba(255,255,255,0.25); }

  /* ===== 鼠标光晕 ===== */
  .cursor-dot, .cursor-halo {
    position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
    border-radius: 50%; transform: translate(-50%, -50%);
  }
  .cursor-dot { width: 8px; height: 8px; background: var(--text); transition: transform 0.08s ease; }
  .cursor-halo {
    width: 40px; height: 40px;
    background: rgba(59,130,246,0.06);
    border: 1px solid rgba(59,130,246,0.18);
  }
  .cursor-halo.hovering { width: 64px; height: 64px; background: rgba(59,130,246,0.03); }

  /* ===== 呼吸按钮 ===== */
  .btn-breathe {
    display: inline-block; padding: 10px 22px;
    border: 1px solid var(--accent); border-radius: 999px;
    color: var(--accent); font-size: 14px; font-weight: 600;
    background: #fff; cursor: pointer; text-align: center;
    animation: breathe 2.4s ease-in-out infinite;
    transition: all 0.2s ease;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.2); }
    50%      { box-shadow: 0 0 0 10px rgba(59,130,246,0); }
  }
  .btn-breathe:hover { background: var(--accent); color: #fff; animation-play-state: paused; box-shadow: none; }

  /* ===== 点击脉冲 ===== */
  .pulse { animation: pulseRing 0.6s ease-out; }
  @keyframes pulseRing {
    0%   { box-shadow: 0 0 0 0 rgba(59,130,246,0.3); }
    100% { box-shadow: 0 0 0 20px rgba(59,130,246,0); }
  }

  /* ===== 移动端适配 ===== */
  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%; height: auto; position: static;
      flex-direction: row; align-items: center;
      padding: 16px 24px; border-right: none; border-bottom: 1px solid var(--border);
      flex-wrap: wrap; gap: 8px;
    }
    .sidebar .logo { margin: 0 16px 0 0; }
    .sidebar .sub { display: none; }
    .sidebar nav { flex-direction: row; flex-wrap: wrap; }
    .sidebar nav a { padding: 6px 10px; font-size: 13px; border-left: none; }
    .sidebar nav a.active { border-bottom: 2px solid var(--accent); border-left-color: transparent; }
    .sidebar .foot { display: none; }
    .main { margin-left: 0; padding: 32px 20px 48px; }
    .grid { grid-template-columns: 1fr; }
    .block::before { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .card { opacity: 1; transform: none; }
    .btn-breathe { animation: none; }
  }
</style>
</head>
<body>

<div class="layout">

  <!-- 左侧导航栏 -->
  <aside class="sidebar">
    <div class="logo">作品集<span> · Portfolio</span></div>
    <div class="sub">AE 动效 · AI 创作 · Maya 渲染 · 动画</div>
    <nav id="navLinks"></nav>
    <div class="foot">
      <b>联系</b>
      <a class="btn-breathe" href="mailto:ysbiao2005@163.com">联系我</a>
      <br>© 2026
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main">
    <section class="hero">
      <h1>我的作品集</h1>
      <p>AE 动效 · AI 创作 · Maya 渲染 · 动画作品</p>
      <div class="stats">
        <div><b class="count" data-to="0">0</b>全部作品</div>
        <div><b class="count" data-to="0">0</b>视频</div>
        <div><b class="count" data-to="0">0</b>图片</div>
      </div>
    </section>

    <div id="groups"></div>

    <footer style="color:#9ca3af; font-size:12px; padding-top:32px; border-top:1px solid var(--border);">
      黄色标记 = 待接入 B 站；拿到视频 BV 号后填入数据即可显示播放器。
    </footer>
  </main>

</div>

<!-- 灯箱 -->
<div class="lightbox" id="lightbox">
  <button class="close" aria-label="关闭">×</button>
  <img src="" alt="">
</div>

<!-- 鼠标光晕 -->
<div class="cursor-dot"></div>
<div class="cursor-halo"></div>

<script>
var works = [
  { file: "ai梦魇科普.mp4", title: "梦魇科普", tag: "AI", group: "AI 创作", bv: "" },
  { file: "ai王老吉广告.mp4", title: "王老吉广告", tag: "AI", group: "AI 创作", bv: "" },
  { file: "AE color.mp4", title: "Color", tag: "AE", group: "AE 动效", bv: "" },
  { file: "AE loading.mp4", title: "Loading", tag: "AE", group: "AE 动效", bv: "" },
  { file: "AE 信箱 (0-00-00-00).mp4", title: "信箱", tag: "AE", group: "AE 动效", bv: "" },
  { file: "maya房间渲染.jpg", title: "房间渲染", tag: "Maya", group: "Maya 渲染", bv: "" },
  { file: "maya相机渲染.jpg", title: "相机渲染", tag: "Maya", group: "Maya 渲染", bv: "" },
  { file: "maya黑色房间渲染.jpg", title: "黑色房间渲染", tag: "Maya", group: "Maya 渲染", bv: "" },
  { file: "回忆.mp4", title: "回忆", tag: "动画", group: "动画作品", bv: "" },
  { file: "定格动画消防成品.mp4", title: "定格动画 · 消防成品", tag: "动画", group: "动画作品", bv: "" },
  { file: "珠宝快剪.mp4", title: "珠宝快剪", tag: "动画", group: "动画作品", bv: "" },
  { file: "网上接单视频.mp4", title: "网上接单", tag: "动画", group: "动画作品", bv: "" }
];

function playerHtml(w) {
  if (w.bv) {
    return '<div class="player"><span class="badge">B 站</span>' +
      '<iframe src="//player.bilibili.com/player.html?bvid=' + w.bv + '&page=1&autoplay=0" scrolling="no" allowfullscreen></iframe></div>';
  }
  if (w.file.toLowerCase().endsWith(".jpg") || w.file.toLowerCase().endsWith(".png")) {
    return '<div class="player"><img src="' + w.file + '" alt="' + w.title + '" loading="lazy"></div>';
  }
  return '<div class="player"><span class="badge pending">待接入 B 站</span>' +
    '<video controls preload="metadata" playsinline src="' + w.file + '"></video></div>';
}

function cardHtml(w, i) {
  var delay = ' style="transition-delay:' + (i * 70) + 'ms"';
  return '<div class="card"' + delay + ' data-type="' + (w.file.toLowerCase().endsWith(".mp4") ? "video" : "image") + '" data-file="' + w.file + '">' +
    playerHtml(w) +
    '<div class="meta"><h3>' + w.title + '</h3><span>' + w.tag + '</span></div>' +
    '<div class="desc">' + w.file + '</div></div>';
}

var groupNames = [];
var groups = {};
works.forEach(function (w) {
  if (!groups[w.group]) { groups[w.group] = []; groupNames.push(w.group); }
  groups[w.group].push(w);
});

var groupsHtml = "";
groupNames.forEach(function (g) {
  var items = groups[g].map(cardHtml).join("");
  groupsHtml += '<section class="block" id="' + g + '"><h2>' + g + '</h2>' +
    '<div class="group-desc">' + groups[g].length + ' 件作品</div>' +
    '<div class="grid">' + items + '</div></section>';
});
document.getElementById("groups").innerHTML = groupsHtml;

// 侧边栏导航
document.getElementById("navLinks").innerHTML = groupNames.map(function (g) {
  return '<a href="#' + g + '">' + g + '<span class="num">' + groups[g].length + '</span></a>';
}).join("");

// 统计数字
var videoN = works.filter(function (w) { return w.file.toLowerCase().indexOf(".mp4") > -1; }).length;
var imageN = works.length - videoN;
var counts = [works.length, videoN, imageN];
var countEls = document.querySelectorAll(".count");
countEls.forEach(function (el, i) {
  el.setAttribute("data-to", counts[i]);
  el.textContent = "0";
});

// ===================== 滚动渐入 =====================
function initReveal() {
  var els = document.querySelectorAll(".block, .card");
  var navLinks = document.querySelectorAll(".sidebar nav a");
  var blocks = document.querySelectorAll(".block");
  var countDone = false;

  function animateCount(el) {
    var to = parseInt(el.getAttribute("data-to"), 10);
    var t0 = null, dur = 900;
    function step(ts) {
      if (!t0) t0 = ts;
      var p = Math.min((ts - t0) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(to * eased);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function highlightNav() {
    var pos = window.scrollY + 80;
    var current = "";
    blocks.forEach(function (b) {
      if (b.offsetTop <= pos) current = b.id;
    });
    navLinks.forEach(function (a) {
      a.classList.toggle("active", a.getAttribute("href") === "#" + current);
    });
  }

  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          e.target.classList.add("in");
          if (!countDone && e.target.classList.contains("block")) {
            countDone = true;
            countEls.forEach(animateCount);
          }
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.08 });
    els.forEach(function (el) { io.observe(el); });
    blocks.forEach(function (b) { io.observe(b); });
  } else {
    els.forEach(function (el) { el.classList.add("in"); });
    countEls.forEach(animateCount);
  }

  window.addEventListener("scroll", highlightNav, { passive: true });
  highlightNav();
}
initReveal();

// ===================== 灯箱：点击查看完整 =====================
(function () {
  var lightbox = document.getElementById("lightbox");
  var lbImg = lightbox.querySelector("img");
  var closeBtn = lightbox.querySelector(".close");

  document.querySelectorAll(".card").forEach(function (card) {
    var type = card.getAttribute("data-type");
    var file = card.getAttribute("data-file");

    card.addEventListener("click", function (e) {
      // B 站 iframe 或已有播放器不拦截
      if (e.target.closest("iframe")) return;

      if (type === "video" && !file.toLowerCase().endsWith(".jpg")) {
        // 视频：弹出播放器
        var videoEl = card.querySelector("video");
        if (videoEl) {
          var lbVideo = document.createElement("video");
          lbVideo.src = videoEl.src;
          lbVideo.controls = true;
          lbVideo.autoplay = true;
          lbVideo.style.cssText = "max-width:92vw;max-height:88vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.4);background:#000";
          lightbox.innerHTML = '';
          lightbox.appendChild(closeBtn);
          lightbox.appendChild(lbVideo);
          lightbox.classList.add("open");
          // 重新绑定关闭按钮
          closeBtn.onclick = function () {
            lbVideo.pause();
            lightbox.classList.remove("open");
            // 恢复 img
            lightbox.innerHTML = '';
            lightbox.appendChild(closeBtn);
            lightbox.appendChild(lbImg);
          };
        }
      } else {
        // 图片：弹出大图
        var imgEl = card.querySelector("img");
        if (imgEl) {
          lbImg.src = imgEl.src;
          lbImg.alt = imgEl.alt;
          lightbox.classList.add("open");
        }
      }
    });
  });

  function closeLightbox() {
    lightbox.classList.remove("open");
    // 如果是视频，停止播放
    var playingVideo = lightbox.querySelector("video");
    if (playingVideo) playingVideo.pause();
    // 恢复 img 结构
    if (!lightbox.querySelector("img")) {
      lightbox.innerHTML = '';
      lightbox.appendChild(closeBtn);
      lightbox.appendChild(lbImg);
    }
  }

  closeBtn.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", function (e) {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeLightbox();
  });
})();

// ===================== 鼠标跟随 =====================
(function () {
  if (!window.matchMedia("(pointer: fine)").matches) return;
  var dot = document.querySelector(".cursor-dot");
  var halo = document.querySelector(".cursor-halo");
  var tx = 0, ty = 0, hx = 0, hy = 0, raf = null;

  document.addEventListener("mousemove", function (e) {
    tx = e.clientX; ty = e.clientY;
    dot.style.left = tx + "px";
    dot.style.top = ty + "px";
    if (!raf) raf = requestAnimationFrame(loop);
  });

  function loop() {
    hx += (tx - hx) * 0.16;
    hy += (ty - hy) * 0.16;
    halo.style.left = hx + "px";
    halo.style.top = hy + "px";
    if (Math.abs(tx - hx) > 0.5 || Math.abs(ty - hy) > 0.5) {
      raf = requestAnimationFrame(loop);
    } else { raf = null; }
  }

  document.addEventListener("mouseover", function (e) {
    halo.classList.toggle("hovering", !!e.target.closest("a, .card, button"));
  });
})();

// ===================== 点击脉冲 =====================
(function () {
  document.querySelectorAll(".card, .btn-breathe").forEach(function (el) {
    el.addEventListener("click", function () {
      el.classList.remove("pulse");
      void el.offsetWidth;
      el.classList.add("pulse");
    });
  });
})();
</script>
</body>
</html>
