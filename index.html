.cursor-dot,.cursor-halo{position:fixed;top:0;left:0;pointer-events:none;z-index:9999;border-radius:50%;transform:translate(-50%,-50%)}

@media(max-width:860px){.layout{flex-direction:column}.sidebar{width:100%;height:auto;position:static;flex-direction:row;align-items:center;padding:16px 24px;border-right:none;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}.sidebar .logo{margin:0 16px 0 0}.sidebar .sub{display:none}.sidebar nav{flex-direction:row;flex-wrap:wrap}.sidebar nav a{padding:6px 10px;font-size:13px;border-left:none}.sidebar nav a.active{border-bottom:2px solid var(--accent);border-left-color:transparent}.sidebar .foot{margin-top:8px;width:100%}.sidebar .foot .contact-wrap{display:none}.mobile-contact{display:block!important}.main{margin-left:0;padding:32px 20px 48px}.grid{grid-template-columns:1fr}.contact-card{bottom:auto;top:calc(100% + 8px)}.floating-decor{display:none}.cursor-dot,.cursor-halo{display:none!important}}

</style>
</head>

(function(){if(!window.matchMedia("(pointer:fine)").matches)return;var d=document.querySelector(".cursor-dot"),h=document.querySelector(".cursor-halo"),tx=0,ty=0,hx=0,hy=0,r=null;

function loop(){hx+=(tx-hx)*.16;hy+=(ty-hy)*.16;h.style.left=hx+"px";h.style.top=hy+"px";if(Math.abs(tx-hx)>.5||Math.abs(ty-hy)>.5)r=requestAnimationFrame(loop);else r=null}

(function(){var pop=document.getElementById("hoverPop"),pt=pop.querySelector(".pop-title"),pf=pop.querySelector(".pop-file"),pp=pop.querySelector(".pop-tag");if(!window.matchMedia("(pointer:fine)").matches)return;
document.querySelectorAll(".card").forEach(function(card){card.addEventListener("mouseenter",function(){pt.textContent=card.getAttribute("data-title");pp.textContent=card.getAttribute("data-file").split(" ")[0];pf.textContent=card.getAttribute("data-file");pop.classList.add("show")});
card.addEventListener("mousemove",function(e){var px=e.clientX+16,py=e.clientY+16,pw=pop.offsetWidth,ph=pop.offsetHeight;if(px+pw>window.innerWidth-12)px=e.clientX-pw-12;if(py+ph>window.innerHeight-12)py=e.clientY-ph-12;pop.style.left=px+"px";pop.style.top=py+"px"});
